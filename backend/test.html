<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        .header {
            background-color: #001A63;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .pricing-table {
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            text-align: center;
        }
        .pricing-table table {
            width: 100%;
            border-collapse: collapse;
        }
        .pricing-table th, .pricing-table td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        .dropdowns {
            text-align: center;
            margin-top: 20px;
        }
        .dropdowns button {
            padding: 10px 20px;
            margin: 10px;
            background-color: #001A63;
            color: white;
            border: none;
            cursor: pointer;
        }
        .footer {
            background-color: #001A63;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .footer a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Service 24/7</h1>
    <p>Call us: 961-333-066 | From 30-60 days | 24/7 Home Service</p>
</div>

<div class="pricing-table">
    <h2>Pricing Table</h2>
    <table>
        <tr>
            <th>Service</th>
            <th>Price</th>
        </tr>
        <tr>
            <td>Service 1</td>
            <td>$100</td>
        </tr>
        <tr>
            <td>Service 2</td>
            <td>$150</td>
        </tr>
    </table>
</div>

<div class="dropdowns">
    <h3>Service Locations</h3>
    <button>Location 1</button>
    <button>Location 2</button>
    <button>Location 3</button>
</div>

<div class="footer">
    <p>Contact us: 961-333-066</p>
    <p>
        <a href="#">Facebook</a>
        <a href="#">Twitter</a>
        <a href="#">Instagram</a>
    </p>
</div>

</body>
</html>
